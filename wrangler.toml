name = "wordmarks-v2"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "out"

# ─── D1 Database ────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "wordmarks-db"
database_id = "0b243319-821b-42a0-b0d0-36d27dac4a61"

# ─── KV Namespace (rate limiting + caching) ─────────────
[[kv_namespaces]]
binding = "WORDMARKS_KV"
id = "bbffa8e810ee4ec1a25f61de6fd840ec"

# ─── R2 Object Storage ───────────────────────────────────
# R2 bindings are intentionally omitted for the free deployment without R2.

# ─── Environment Variables ──────────────────────────────
# Set these via wrangler pages secret put:
#   OPENAI_API_KEY       - OpenAI API key (NEVER commit to repo)
#   WORDMARKS_MCP_TOKEN  - Auth token for MCP agents
#
# DO NOT add secrets here. Use:
#   wrangler pages secret put OPENAI_API_KEY --project-name=wordmarks-v2
#   wrangler pages secret put WORDMARKS_MCP_TOKEN --project-name=wordmarks-v2
