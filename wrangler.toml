name = "wordmarks-net"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "out"

# ─── D1 Database ────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "wordmarks-db"
database_id = "4960d370-b0cd-42ba-aad6-fd400cc21a90"

# ─── KV Namespace (rate limiting + caching) ─────────────
[[kv_namespaces]]
binding = "WORDMARKS_KV"
id = "29de00d7b63e43b1adb2fdae89cc6a45"

# ─── R2 Object Storage ───────────────────────────────────
# R2 bindings are intentionally omitted for the free deployment without R2.

# ─── Environment Variables ──────────────────────────────
# Set these via wrangler pages secret put:
#   OPENAI_API_KEY       - OpenAI API key (NEVER commit to repo)
#   WORDMARKS_MCP_TOKEN  - Auth token for MCP agents
#   ADMIN_PASSWORD       - Password for the protected Admin Studio
#   STRIPE_SECRET_KEY    - Stripe server API key
#   STRIPE_WEBHOOK_SECRET - Stripe webhook signing secret
#   STRIPE_PRICE_INITIAL_25 - One-time $25 / 25-credit Price ID
#   STRIPE_PRICE_LITE, STRIPE_PRICE_GROWTH, STRIPE_PRICE_PRO, STRIPE_PRICE_SCALE
#
# DO NOT add secrets here. Use:
#   wrangler pages secret put OPENAI_API_KEY --project-name=wordmarks-v2
#   wrangler pages secret put WORDMARKS_MCP_TOKEN --project-name=wordmarks-v2
